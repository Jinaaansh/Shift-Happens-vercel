<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Face Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  /* ============ 1. COLOURS (red = you, blue = opponent, matching the background image) ============ */
  :root {
    --team-red: #d42a2f;
    --team-red-dark: #7d0f14;
    --team-blue: #1d6df0;
    --team-blue-dark: #0d3a91;
    --chip-gold: #ffd23f;
    --chip-red: #e5484d;
    --chip-blue: #4f8cff;
    --card: #fffdf7;
    --ink: #1c1c1c;
    /* black comic outline for text that sits on the busy background */
    --outline: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 3px 0 #000;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: #fff;
    /* background image first; if the file is missing, the red/blue split below is shown instead */
    background:
      url('vs-background.png') center / cover no-repeat fixed,
      linear-gradient(100deg, var(--team-red) 0 48%, #fff 48% 52%, var(--team-blue) 52%) fixed;
    font-family: 'Nunito', sans-serif; font-weight: 600;
    display: flex; flex-direction: column; padding: 14px 18px; gap: 10px;
  }
  button { font-family: inherit; cursor: pointer; }

  /* ============ 2. TOP BAR ============ */
  header { display: flex; justify-content: center; align-items: center; position: relative; }
  h1 { font-family: 'Bungee', sans-serif; font-size: clamp(1.4rem, 4vw, 2.6rem); margin: 0;
       color: var(--chip-gold); text-shadow: var(--outline); }
  #timer { position: absolute; right: 0; font-family: 'Bungee', sans-serif; font-size: 1.5rem;
           display: none; text-shadow: var(--outline); }
  #banner { text-align: center; min-height: 26px; font-weight: 800; font-size: 1.1rem;
            color: var(--chip-gold); text-shadow: var(--outline); }

  /* ============ 3. SCREENS (only one is visible at a time) ============ */
  .screen { display: none; flex: 1; }
  .screen.active { display: flex; flex-direction: column; gap: 12px; }
  .center { align-items: center; justify-content: center; text-align: center; }

  /* white comic panel used on the join and result screens */
  .panel { background: var(--card); color: var(--ink); border: 4px solid #000; border-radius: 16px;
           box-shadow: 8px 8px 0 #000; padding: 24px; display: flex; flex-direction: column;
           gap: 12px; width: min(400px, 100%); }
  .panel small { color: #444; }
  .vs-strip { display: flex; align-items: center; justify-content: center; gap: 8px;
              font-family: 'Bungee', sans-serif; font-size: 1.1rem; }
  .vs-strip span { padding: 4px 12px; border: 3px solid #000; border-radius: 10px; color: #fff; text-shadow: var(--outline); }
  .vs-strip .red { background: var(--team-red); }
  .vs-strip .blue { background: var(--team-blue); }
  .vs-strip .vs { background: var(--chip-gold); color: var(--ink); text-shadow: none; }
  input[type=text] { padding: 12px; border-radius: 10px; border: 3px solid #000; font: inherit; font-size: 1rem; }
  #nameInput { border-left: 12px solid var(--team-red); }   /* red = you */
  #roomInput { border-left: 12px solid var(--team-blue); }  /* blue = opponent / room */
  .btn { background: var(--chip-gold); color: var(--ink); border: 3px solid #000; border-radius: 12px;
         padding: 12px 20px; font-family: 'Bungee', sans-serif; font-size: 1rem; box-shadow: 0 5px 0 #000; }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }

  /* ============ 4. MATCH LAYOUT (matches your sketch) ============ */
  #arena {
    display: grid; align-items: center; gap: 10px; flex: 1;
    grid-template-columns: minmax(120px, 1.3fr) minmax(90px, .8fr) minmax(70px, 1.2fr) minmax(90px, .8fr) minmax(120px, 1.3fr);
  }
  .side { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .video-tile {
    position: relative; aspect-ratio: 3 / 4; max-height: 58vh; width: 100%; margin: 0 auto;
    border-radius: 16px; overflow: hidden; border: 5px solid #fff; box-shadow: 0 0 0 3px #000, 0 8px 18px #0009;
  }
  #tile-me  { background: var(--team-red-dark); }
  #tile-opp { background: var(--team-blue-dark); }
  .video-tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #tile-me video { transform: scaleX(-1); } /* mirror my own camera */
  .face { position: absolute; inset: 0; display: grid; place-items: center; font-size: 4.5rem; }

  /* name tags are coloured by team */
  .name { font-weight: 800; text-align: center; width: fit-content; margin: 4px auto 0; padding: 2px 14px;
          border: 3px solid #000; border-radius: 999px; text-shadow: var(--outline); }
  #name-me  { background: var(--team-red); }
  #name-opp { background: var(--team-blue); }
  .score { text-align: center; color: var(--chip-gold); font-weight: 800; text-shadow: var(--outline); }
  .laugh-bar { height: 10px; background: #000000aa; border: 2px solid #000; border-radius: 6px; overflow: hidden; }
  .laugh-bar > div { height: 100%; width: 0; background: var(--chip-gold); transition: width .1s; }

  /* meme that is currently playing on a tile */
  .overlay { position: absolute; inset: 0; background: #000000cc; display: none; flex-direction: column;
             align-items: center; justify-content: center; gap: 8px; text-align: center; }
  .overlay.show { display: flex; }
  .overlay .big { font-size: 5rem; }
  .overlay img, .overlay video { width: 100%; height: 100%; object-fit: contain; }

  /* "meme incoming" / "sent" ring */
  .incoming { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
              text-align: center; border: 6px solid var(--chip-gold); background: #00000055; text-shadow: var(--outline); }
  .incoming.show { display: flex; animation: pulse .6s infinite alternate; }
  .incoming.sent { border-color: #fff; }
  .incoming b { display: block; font-family: 'Bungee', sans-serif; font-size: 4rem; }
  @keyframes pulse { to { background-color: #000000aa; } }

  /* BLOCKED / REFLECTED / result stamp */
  .stamp { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-family: 'Bungee', sans-serif;
           font-size: 1.6rem; color: var(--chip-gold); text-shadow: var(--outline); display: none; }
  .stamp.show { display: block; animation: pop 1.4s ease-out forwards; }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 20% { transform: scale(1.2); opacity: 1; }
                   80% { opacity: 1; } 100% { transform: scale(1); opacity: 0; } }

  /* ============ 5. COMPOSURE METER: laughing emoji hidden under a cover ============ */
  .meter-col { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .meter-col small { font-size: .9rem; font-weight: 800; text-shadow: var(--outline); }
  .meter {
    position: relative; font-size: clamp(3.4rem, 8vw, 7rem); width: 1.5em; height: 1.5em;
    display: grid; place-items: center; background: #fffdf7; border: 4px solid #000;
    border-radius: 22px; overflow: hidden; box-shadow: 0 6px 0 #000;
  }
  .meter .emoji { line-height: 1; }
  .meter .cover {                         /* shrinks as composure drops = emoji gets revealed from the top */
    position: absolute; left: 0; right: 0; bottom: 0; height: 100%;
    border-top: 4px solid var(--chip-gold); transition: height .3s;
  }
  #cover-me  { background: repeating-linear-gradient(45deg, var(--team-red-dark) 0 10px, var(--team-red) 10px 20px); }
  #cover-opp { background: repeating-linear-gradient(45deg, var(--team-blue-dark) 0 10px, var(--team-blue) 10px 20px); }
  .meter.danger { animation: shake .4s infinite; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  /* centre gap: the VS cloud and white bolt of the background image show through here */
  #vs-gap { width: 100%; min-height: 260px; border-radius: 50%; pointer-events: none; }
  #vs-gap.hot { background: radial-gradient(circle, #ffffffaa 0, transparent 70%); animation: flash .4s infinite alternate; }
  @keyframes flash { to { opacity: .25; } }

  /* ============ 6. HAND OF CARDS ============ */
  #hand { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; align-items: flex-end;
          background: #000000a8; border: 3px solid #000; padding: 12px; border-radius: 16px; }
  .card { width: 104px; background: var(--card); color: var(--ink); border: 3px solid #000;
          border-radius: 12px; padding: 8px 6px; text-align: center; font-weight: 800; transition: transform .15s; }
  .card:hover:not(:disabled) { transform: translateY(-8px); }
  .card .icon { font-size: 2.2rem; display: block; }
  .card small { display: block; color: #666; font-weight: 600; }
  .card:disabled { opacity: .4; cursor: not-allowed; }
  .card.defence { background: #dbe8ff; }
  .card.ready { border-color: var(--chip-blue); animation: glow .5s infinite alternate; }
  @keyframes glow { to { box-shadow: 0 0 18px var(--chip-blue); } }
  .sep { width: 2px; align-self: stretch; background: #ffffff60; margin: 0 6px; }

  /* ============ 7. RESULT ============ */
  #resultTitle { font-family: 'Bungee', sans-serif; font-size: 2.6rem; margin: 0;
                 color: var(--chip-gold); text-shadow: var(--outline); }

  /* ============ 8. DEV PANEL (delete once the real AI is connected) ============ */
  #dev { position: fixed; right: 10px; bottom: 10px; background: #000000cc; padding: 8px 12px; border-radius: 12px;
         font-size: .8rem; max-width: 230px; display: none; }
  #dev.show { display: block; }
  #dev label { display: block; margin-top: 6px; }
  #dev input[type=range] { width: 100%; }
  #dev button { margin-top: 8px; width: 100%; padding: 6px; border-radius: 8px; border: 0; }

  @media (max-width: 760px) {
    #arena { grid-template-columns: 1fr 70px 30px 70px 1fr; gap: 4px; }
    .meter { font-size: 2.6rem; border-radius: 12px; }
    .card { width: 84px; }
    .face { font-size: 3rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header>
  <h1>Poker Face Arena</h1>
  <div id="timer">3:00</div>
</header>
<div id="banner"></div>

<!-- ================= SCREEN 1: LOBBY ================= -->
<section id="screen-lobby" class="screen active center">
  <div class="panel">
    <div class="vs-strip"><span class="red">YOU</span><span class="vs">VS</span><span class="blue">OPPONENT</span></div>
    <strong>Keep a straight face. Make them laugh.</strong>
    <input type="text" id="nameInput" placeholder="Your name" maxlength="14">
    <input type="text" id="roomInput" placeholder="Room code (optional)" maxlength="8">
    <button class="btn" id="joinBtn">Join match</button>
    <small>Until the video call is connected, you play against a practice opponent.</small>
  </div>
</section>

<!-- ================= SCREEN 2: MATCH ================= -->
<section id="screen-match" class="screen">
  <div id="arena">

    <!-- my video -->
    <div class="side">
      <div class="video-tile" id="tile-me">
        <div class="face">😎</div>
        <div class="overlay" id="overlay-me"></div>
        <div class="incoming" id="incoming-me"></div>
        <div class="stamp" id="stamp-me"></div>
      </div>
      <div class="name" id="name-me">You</div>
      <div class="laugh-bar" title="Live laugh reading"><div id="laughbar-me"></div></div>
      <div class="score" id="score-me">0 pts</div>
    </div>

    <!-- my composure -->
    <div class="meter-col">
      <div class="meter" id="meter-me"><span class="emoji">😂</span><div class="cover" id="cover-me"></div></div>
      <small>Your composure<br><b id="pct-me">100%</b></small>
    </div>

    <!-- centre gap: the VS cloud and white bolt from the background image show through here -->
    <div id="vs-gap" aria-hidden="true"></div>

    <!-- opponent composure -->
    <div class="meter-col">
      <div class="meter" id="meter-opp"><span class="emoji">😂</span><div class="cover" id="cover-opp"></div></div>
      <small>Their composure<br><b id="pct-opp">100%</b></small>
    </div>

    <!-- opponent video -->
    <div class="side">
      <div class="video-tile" id="tile-opp">
        <div class="face">🙂</div>
        <div class="overlay" id="overlay-opp"></div>
        <div class="incoming" id="incoming-opp"></div>
        <div class="stamp" id="stamp-opp"></div>
      </div>
      <div class="name" id="name-opp">Opponent</div>
      <div class="laugh-bar" title="Live laugh reading"><div id="laughbar-opp"></div></div>
      <div class="score" id="score-opp">0 pts</div>
    </div>
  </div>

  <!-- my cards -->
  <div id="hand"></div>
</section>

<!-- ================= SCREEN 3: RESULT ================= -->
<section id="screen-result" class="screen center">
  <div class="panel">
    <h2 id="resultTitle">You win!</h2>
    <div id="resultStats"></div>
    <button class="btn" id="againBtn">Play again</button>
  </div>
</section>

<!-- ================= DEV PANEL ================= -->
<div id="dev">
  <strong>Dev panel</strong> (fake data)
  <label>My laugh <input type="range" id="laugh-me" min="0" max="100" value="0"></label>
  <label>Opponent laugh <input type="range" id="laugh-opp" min="0" max="100" value="0"></label>
  <button id="oppAttackBtn">Opponent attacks me</button>
</div>

<script>
/* ============ A. GAME DATA ============ */
// Later: set "file" to a real GIF or MP4, e.g. file: "memes/cat.mp4"
const MEMES = [
  { id: 'm1', name: 'Dancing Cat',  icon: '🐱', power: 1,   file: null },
  { id: 'm2', name: 'Fail Video',   icon: '🤕', power: 1.5, file: null },
  { id: 'm3', name: 'Cursed Meme',  icon: '👁️', power: 2,   file: null },
  { id: 'm4', name: 'Dad Joke',     icon: '👨', power: 1,   file: null },
  { id: 'm5', name: 'Surprise GIF', icon: '🎁', power: 2.5, file: null },
];
const DEFENCES = {
  shield:  { icon: '🛡️', name: 'Shield',  text: 'Blocks the meme' },
  reflect: { icon: '🪞', name: 'Reflect', text: 'Sends it back' },
};

const TICK = 100;             // the game loop runs every 100 ms
const ROUND_MS = 180000;      // 3 minute round
const LOCK_MS = 5000;         // after any attack, nobody can attack for 5 s
const WINDOW_MS = 3000;       // target has 3 s to defend before the meme plays
const METER_MS = 3000;        // how long the meme plays and laughs are measured
const TALK_LAUGH_LIMIT = 40;  // laughs above this drain composure even without a card

/* ============ B. STATE (everything the game knows lives here) ============ */
function newState() {
  const player = (name) => ({ name, composure: 100, score: 0, laugh: 0, shield: 1, reflect: 1 });
  return { running: false, msLeft: ROUND_MS, lockMs: 0,
           pending: null,  // attack waiting for the defence window to end
           hit: null,      // meme currently playing on someone
           me: player('You'), opp: player('Opponent') };
}
let S = newState();
const $ = (id) => document.getElementById(id);
const other = (who) => (who === 'me' ? 'opp' : 'me');
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/* ============ C. SCREENS ============ */
function showScreen(name) {
  ['lobby', 'match', 'result'].forEach(s => $('screen-' + s).classList.toggle('active', s === name));
  $('timer').style.display = name === 'match' ? 'block' : 'none';
  $('dev').classList.toggle('show', name === 'match');
}

/* ============ D. HAND OF CARDS ============ */
function buildHand() {
  const hand = $('hand');
  hand.innerHTML = '';
  MEMES.forEach(m => {
    const b = document.createElement('button');
    b.className = 'card'; b.id = 'card-' + m.id;
    b.innerHTML = `<span class="icon">${m.icon}</span>${m.name}<small>x${m.power} power</small>`;
    b.onclick = () => playAttack('me', m.id);
    hand.appendChild(b);
  });
  hand.insertAdjacentHTML('beforeend', '<div class="sep"></div>');
  Object.keys(DEFENCES).forEach(type => {
    const d = DEFENCES[type];
    const b = document.createElement('button');
    b.className = 'card defence'; b.id = 'def-' + type;
    b.onclick = () => useDefence('me', type);
    b.innerHTML = `<span class="icon">${d.icon}</span>${d.name}<small>${d.text}</small><small id="uses-${type}"></small>`;
    hand.appendChild(b);
  });
}

/* ============ E. ATTACK -> DEFENCE WINDOW -> MEME -> RESULT ============ */
function playAttack(who, memeId) {
  if (!S.running || S.lockMs > 0 || S.pending || S.hit) return false;
  const card = MEMES.find(m => m.id === memeId);
  S.lockMs = LOCK_MS;
  S.pending = { attacker: who, target: other(who), card, ms: WINDOW_MS, botType: null, botAt: 0 };

  if (who === 'me') {
    // practice opponent sometimes defends (remove when a real opponent is connected)
    const r = Math.random();
    if (r < 0.25 && S.opp.shield > 0) S.pending.botType = 'shield';
    else if (r < 0.40 && S.opp.reflect > 0) S.pending.botType = 'reflect';
    S.pending.botAt = 500 + Math.random() * 1800;
    showIncoming('opp', 'SENT', 'sent');
  } else {
    showIncoming('me', 'INCOMING!', '');
  }
  refresh();
  return true;
}

function useDefence(who, type) {
  const p = S.pending;
  if (!p || p.target !== who || S[who][type] <= 0) return;
  S[who][type]--;
  S.pending = null;
  hideIncoming();
  if (type === 'shield') {
    stamp(who, 'BLOCKED 🛡️');
  } else {
    stamp(who, 'REFLECTED 🪞');
    startHit(p.attacker, who, p.card);   // the meme now plays on the attacker
  }
  refresh();
}

function startHit(target, attacker, card) {
  S.hit = { target, attacker, card, ms: METER_MS, peak: 0 };
  showMeme(target, card);
}

function finishHit() {
  const h = S.hit;
  const damage = h.peak * h.card.power * 0.3;           // composure lost by the target
  const points = Math.round(h.peak * h.card.power);     // points won by the attacker
  S[h.target].composure = clamp(S[h.target].composure - damage, 0, 100);
  S[h.attacker].score += points;
  hideMeme(h.target);
  stamp(h.target, h.peak > 15 ? `😂 ${Math.round(h.peak)}%` : 'Poker face!');
  S.hit = null;
}

/* ============ F. GAME LOOP ============ */
function tick() {
  if (!S.running) return;

  S.msLeft -= TICK;
  if (S.lockMs > 0) S.lockMs -= TICK;

  if (S.pending) {
    const p = S.pending;
    p.ms -= TICK;
    const num = document.querySelector('#incoming-' + p.target + ' b');
    if (num) num.textContent = Math.max(1, Math.ceil(p.ms / 1000));
    if (p.botType && WINDOW_MS - p.ms >= p.botAt) { const t = p.botType; p.botType = null; useDefence('opp', t); }
    if (S.pending && S.pending.ms <= 0) {
      const q = S.pending; S.pending = null; hideIncoming();
      startHit(q.target, q.attacker, q.card);
    }
  }

  if (S.hit) {
    S.hit.ms -= TICK;
    S.hit.peak = Math.max(S.hit.peak, S[S.hit.target].laugh);   // highest laugh during the meme counts
    if (S.hit.ms <= 0) finishHit();
  }

  // laughing from plain conversation also drains composure (but gives nobody points)
  ['me', 'opp'].forEach(w => {
    const underMeme = S.hit && S.hit.target === w;
    if (!underMeme && S[w].laugh > TALK_LAUGH_LIMIT) {
      S[w].composure = Math.max(0, S[w].composure - (S[w].laugh - TALK_LAUGH_LIMIT) / 60 * 0.15);
    }
  });

  refresh();
  if (S.me.composure <= 0 || S.opp.composure <= 0 || S.msLeft <= 0) endMatch();
}

/* ============ G. SCREEN UPDATES ============ */
function refresh() {
  ['me', 'opp'].forEach(w => {
    const c = Math.round(S[w].composure);
    $('cover-' + w).style.height = c + '%';
    $('pct-' + w).textContent = c + '%';
    $('meter-' + w).classList.toggle('danger', c < 25 && c > 0);
    $('score-' + w).textContent = S[w].score + ' pts';
    $('laughbar-' + w).style.width = S[w].laugh + '%';
  });
  const secs = Math.max(0, Math.ceil(S.msLeft / 1000));
  $('timer').textContent = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
  $('vs-gap').classList.toggle('hot', !!(S.pending || S.hit));

  const busy = S.lockMs > 0 || !!S.pending || !!S.hit;
  MEMES.forEach(m => { $('card-' + m.id).disabled = busy || !S.running; });
  Object.keys(DEFENCES).forEach(type => {
    const canUse = S.pending && S.pending.target === 'me' && S.me[type] > 0;
    const btn = $('def-' + type);
    btn.disabled = !canUse;
    btn.classList.toggle('ready', !!canUse);
    $('uses-' + type).textContent = S.me[type] + ' left';
  });

  let msg = '';
  if (S.running) {
    if (S.pending && S.pending.target === 'me') msg = 'Meme incoming! Play Shield or Reflect now';
    else if (S.pending) msg = 'Your meme is on its way...';
    else if (S.hit) msg = S.hit.target === 'me' ? 'Hold your poker face!' : 'Watch them crack...';
    else if (S.lockMs > 0) msg = 'Attacks locked: ' + Math.ceil(S.lockMs / 1000) + 's';
    else msg = 'Attacks open. Play a card!';
  }
  $('banner').textContent = msg;
}

function showIncoming(who, label, kind) {
  const el = $('incoming-' + who);
  el.className = 'incoming show ' + kind;
  el.innerHTML = `<div>${label}<b>3</b></div>`;
}
function hideIncoming() { ['me', 'opp'].forEach(w => $('incoming-' + w).className = 'incoming'); }

function showMeme(who, card) {
  const el = $('overlay-' + who);
  if (card.file && /\.(mp4|webm)$/i.test(card.file)) el.innerHTML = `<video src="${card.file}" autoplay muted loop playsinline></video>`;
  else if (card.file) el.innerHTML = `<img src="${card.file}" alt="${card.name}">`;
  else el.innerHTML = `<div class="big">${card.icon}</div><div>${card.name}</div>`;
  el.classList.add('show');
}
function hideMeme(who) { const el = $('overlay-' + who); el.classList.remove('show'); el.innerHTML = ''; }

function stamp(who, text) {
  const el = $('stamp-' + who);
  el.textContent = text;
  el.classList.remove('show'); void el.offsetWidth;   // restart the animation
  el.classList.add('show');
}

/* ============ H. START / END ============ */
function startMatch() {
  const myName = $('nameInput').value.trim() || 'You';
  S = newState();
  S.me.name = myName;
  $('name-me').textContent = myName;
  $('laugh-me').value = 0; $('laugh-opp').value = 0;
  hideIncoming(); hideMeme('me'); hideMeme('opp');
  S.running = true;
  buildHand();
  showScreen('match');
  refresh();
  startCamera();
}

function endMatch() {
  S.running = false;
  hideIncoming(); hideMeme('me'); hideMeme('opp');
  let title;
  if (S.me.composure <= 0 && S.opp.composure > 0) title = 'You cracked!';
  else if (S.opp.composure <= 0 && S.me.composure > 0) title = 'You win!';
  else if (S.me.score > S.opp.score) title = 'You win!';
  else if (S.me.score < S.opp.score) title = 'You lose!';
  else title = 'A draw!';
  $('resultTitle').textContent = title;
  $('resultStats').innerHTML =
    `<p>${S.me.name}: ${S.me.score} pts, composure ${Math.round(S.me.composure)}%</p>` +
    `<p>${S.opp.name}: ${S.opp.score} pts, composure ${Math.round(S.opp.composure)}%</p>`;
  showScreen('result');
}

/* ============ I. VIDEO ============ */
let cameraStarted = false;
function startCamera() {
  if (cameraStarted || !navigator.mediaDevices) return;
  cameraStarted = true;
  navigator.mediaDevices.getUserMedia({ video: true, audio: false })
    .then(stream => attachVideo('me', stream))
    .catch(() => { cameraStarted = false; });   // no camera: the emoji placeholder stays
}
function attachVideo(who, stream) {
  const tile = $('tile-' + who);
  let v = tile.querySelector('video.live');
  if (!v) {
    v = document.createElement('video');
    v.className = 'live'; v.autoplay = true; v.playsInline = true; v.muted = (who === 'me');
    tile.prepend(v);
    tile.querySelector('.face').style.display = 'none';
  }
  v.srcObject = stream;
}

/* ============ J. LAUGH INPUT (the AI calls this) ============ */
function setLaugh(who, value) {
  S[who].laugh = clamp(Number(value) || 0, 0, 100);
  $('laugh-' + who).value = S[who].laugh;
}
$('laugh-me').oninput = e => setLaugh('me', e.target.value);
$('laugh-opp').oninput = e => setLaugh('opp', e.target.value);
$('oppAttackBtn').onclick = () => playAttack('opp', MEMES[Math.floor(Math.random() * MEMES.length)].id);

$('joinBtn').onclick = () => {
  if (window.arena.onJoin) window.arena.onJoin($('nameInput').value.trim(), $('roomInput').value.trim());
  startMatch();
};
$('againBtn').onclick = () => showScreen('lobby');

/* ============ K. FUNCTIONS YOUR TEAMMATES CALL ============ */
window.arena = {
  onJoin: null,                    // teammate A: set this to create or join the room
  attachVideo,                     // teammate A: arena.attachVideo('opp', stream)
  setLaugh,                        // teammate B: arena.setLaugh('me', 0-100)
  playAttack,                      // teammate C: arena.playAttack('opp', 'm3')
  useDefence,                      // teammate C: arena.useDefence('opp', 'shield')
  setComposure: (who, v) => { S[who].composure = clamp(v, 0, 100); refresh(); },
  setScore: (who, v) => { S[who].score = v; refresh(); },
  showScreen, startMatch, endMatch,
};

setInterval(tick, TICK);
</script>
</body>
</html>
